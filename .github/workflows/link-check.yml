name: Link check

on:
  pull_request:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Only check external http(s) links. Internal links are validated by
          # astro build (route resolution), and lychee can't resolve them from
          # raw source files anyway. Also exclude JSX template-literal artifacts
          # like {${base}/...} in .mdx files, which lychee misreads as URLs.
          args: >-
            --verbose --no-progress
            --scheme 'https' --scheme 'http'
            --exclude '\$\{base\}'
            './**/*.md' './**/*.mdx'
          fail: true
